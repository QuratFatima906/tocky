name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Advisory: this also flags upstream patch releases, which would otherwise
      # fail pull requests that changed no dependencies. Real dependency
      # breakage still fails the bundle step below.
      - name: Dependency health
        continue-on-error: true
        run: npx expo-doctor

      - name: Bundle for iOS
        run: npx expo export --platform ios --output-dir /tmp/expo-export

      - name: Bundle size budget
        run: node scripts/check-bundle-size.mjs /tmp/expo-export

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test -- --ci --coverage --maxWorkers=2

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: End-to-end (iOS simulator)
    runs-on: macos-15
    # A native build and seven flows on a simulator take far longer than the
    # unit suite, and every one of them depends on that suite being right, so
    # they run once it has passed rather than beside it.
    needs: verify
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot the simulator
        run: |
          xcrun simctl boot "iPhone 17 Pro" || xcrun simctl boot "iPhone 16 Pro"
          xcrun simctl bootstatus booted

      - name: Build and install the app
        run: npx expo run:ios --configuration Release --no-bundler

      - name: Run the flows
        env:
          MAESTRO_CLI_ANALYSIS_NOTIFICATION_DISABLED: 'true'
        run: maestro test .maestro/

      - name: Upload flow artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: ~/.maestro/tests/
          retention-days: 7
