appId: com.tocky.app
name: Switching asks first, then reuses the picker rather than growing a second
---
- runFlow: subflows/fresh-start.yaml
- runFlow: subflows/start-work-session.yaml
- tapOn: 'Switch'
- assertVisible: 'Pick a category to start'
- tapOn: 'Learning'
- tapOn: 'Start Learning session'
# Tocky never quietly ends what was already being tracked.
- assertVisible: 'Switch to Learning?'
- tapOn: 'Switch'
- assertVisible: 'Tracking session'
- runFlow: subflows/end-session.yaml
