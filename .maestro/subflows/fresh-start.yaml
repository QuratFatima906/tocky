appId: com.tocky.app
name: A fresh install, past onboarding, with nothing tracked
---
# Every flow shares one simulator, so a session left running by the flow before
# turns the next tap on Start into a confirm dialog rather than a timer. Each
# flow buys its own isolation here instead of inheriting whatever came before.
- clearState
- launchApp
- assertVisible: 'Where did your day go?'
- tapOn: 'Skip'
- assertVisible:
    id: 'tocky-tab-bar'
